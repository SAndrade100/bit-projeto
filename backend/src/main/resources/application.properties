spring.application.name=solicitacoes

# Banco (valores padrão = ambiente local com docker compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:solicitacoes}
spring.datasource.username=${DB_USERNAME:solicitacoes}
spring.datasource.password=${DB_PASSWORD:secret}

# O esquema é gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Fuso usado para interpretar os filtros de período (datas sem horário)
app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}

# Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Erros no formato RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
