spring.application.name=solicitacoes

# Banco (valores padrão = ambiente local com docker compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:solicitacoes}
spring.datasource.username=${DB_USERNAME:solicitacoes}
spring.datasource.password=${DB_PASSWORD:secret}

# O esquema é gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
