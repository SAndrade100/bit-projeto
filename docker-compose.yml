name: solicitacoes-spring-angular

# Fase 0: apenas o banco. api e web são adicionados nas fases seguintes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-solicitacoes}
      POSTGRES_USER: ${DB_USERNAME:-solicitacoes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-solicitacoes} -d ${DB_DATABASE:-solicitacoes}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
