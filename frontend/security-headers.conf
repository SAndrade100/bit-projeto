# Impede que o portal seja exibido dentro de iframes de outros sites (clickjacking),
# que o navegador "adivinhe" tipos de conteúdo e limita o vazamento de URLs em links externos.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
