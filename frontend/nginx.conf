server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API fica na mesma origem do site: sem CORS e com o cookie de sessão
    # e o cookie CSRF válidos para o navegador.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os cabeçalhos de segurança ficam só nos locais que servem a SPA: o add_header de um location
    # substitui os do nível acima, e a API já envia os seus próprios (evita duplicá-los).

    # Arquivos com hash no nome podem ser cacheados por muito tempo.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # O index.html nunca deve ser cacheado (referencia os arquivos com hash atuais).
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
